# This repo is a "semantic" fork of JabRef/JabRef-Browser-Extension, not a
# GitHub fork, so there is no Sync-fork button. main is a pure fast-forward
# mirror of upstream main; experimental = main + the PRs listed below.
#
# Every listed PR must target main, never experimental: merging a PR's head
# into its own base branch makes GitHub close it as merged and delete its head
# branch. That is what happened to #81, now reopened as #89 against main.
# Targeting main also keeps each diff expressed against upstream, so it stays
# portable to JabRef/JabRef-Browser-Extension.
#
# A conflict with main fails loudly - experimental is broken until someone
# merges origin/main into it by hand. A conflicting or vanished PR is only a
# ::warning, so one stale entry never blocks the others. If a sync brings
# workflow-file changes, the push needs RELEASE_PR_TOKEN to carry the
# `workflow` scope.
name: Sync upstream

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - experimental
    paths:
      # Editing the PR list below re-merges right away instead of waiting for the nightly run.
      - .github/workflows/sync-upstream.yml

permissions:
  contents: write

env:
  # Merged into experimental on top of main, in order. Entries are PR URLs,
  # resolved to refs/pull/<number>/head; blank and #-comment lines are ignored.
  PRS: |
    # Merged upstream but not on upstream main, which was rewound to #679 - they
    # would be lost from main otherwise. Two further commits from that stretch,
    # "Add automerge.yml" and "Also approve", had no PR and live on experimental only.
    # chore(deps): update dependency vitest to v4.1.9
    https://github.com/JabRef/JabRef-Browser-Extension/pull/687
    # chore(deps): update dependency vue to v3.5.39
    https://github.com/JabRef/JabRef-Browser-Extension/pull/688
    # chore(deps): update dependency vue-tsc to v3.3.6
    https://github.com/JabRef/JabRef-Browser-Extension/pull/689
    # chore(deps): update dependency wxt to v0.20.27
    https://github.com/JabRef/JabRef-Browser-Extension/pull/690
    # Add fulltext bridge for JabRef Browser-Extension Fulltext Protocol (was #81)
    https://github.com/JabRef/JabRef-Browser-Extension-experimental/pull/89
    # Build and publish safari browser extension
    https://github.com/JabRef/JabRef-Browser-Extension/pull/681
    # Add diagnostics UI and popup logging for native messaging flow
    https://github.com/JabRef/JabRef-Browser-Extension/pull/699
    # Fix Chrome native messaging
    https://github.com/JabRef/JabRef-Browser-Extension/pull/700

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experimental
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: experimental
          fetch-depth: 0
          # PAT instead of github.token so the pushes trigger the test,
          # lint and release workflows on experimental.
          token: ${{ secrets.RELEASE_PR_TOKEN }}

      - name: Fast-forward main from upstream
        run: |
          git fetch https://github.com/JabRef/JabRef-Browser-Extension.git main
          # Plain push refuses non-fast-forward, keeping main a pure mirror.
          # Rewinding it here would silently drop whatever main is ahead by.
          if ! git push origin FETCH_HEAD:refs/heads/main; then
            echo "::warning::main is not a fast-forward of upstream main - left untouched"
          fi

      - name: Merge main and PRs into experimental
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "experimental already contains main"
          else
            git merge --no-edit origin/main
          fi

          while read -r url; do
            case "$url" in '' | '#'*) continue ;; esac
            repo=${url#https://github.com/}
            number=${repo##*/}
            repo=${repo%%/pull/*}
            if ! git fetch --no-tags "https://github.com/$repo.git" "refs/pull/$number/head"; then
              echo "::warning::$url cannot be fetched (deleted?) - skipped"
              echo "- :warning: [$repo#$number]($url) - unreachable, skipped" >> "$GITHUB_STEP_SUMMARY"
            elif git merge --no-edit -m "Merge $repo#$number into experimental" FETCH_HEAD; then
              echo "- :white_check_mark: [$repo#$number]($url)" >> "$GITHUB_STEP_SUMMARY"
            else
              git merge --abort
              echo "::warning::Merge conflict for $url - skipped"
              echo "- :x: [$repo#$number]($url) - merge conflict, skipped" >> "$GITHUB_STEP_SUMMARY"
            fi
          done <<< "$PRS"

          git push origin experimental
