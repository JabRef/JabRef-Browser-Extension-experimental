# This repo is a "semantic" fork of JabRef/JabRef-Browser-Extension, not a
# GitHub fork, so there is no Sync-fork button. main is a pure mirror of
# upstream main, force-reset to it on every run - never commit or merge
# anything here, it will be discarded; experimental = main + the PRs below + one
# commit that belongs to no PR and never goes upstream: 96939bb, which points
# the push triggers at experimental and adds the experimental-latest rolling
# prerelease. That commit is the whole exception - everything else here is
# accounted for by an entry below, so upstream PRs can be filed from the list.
#
# No listed PR may target experimental: merging a PR's head into its own base
# branch makes GitHub close it as merged and delete its head branch. That is
# what happened to #81, now reopened as #89 against main. Base main where you
# can - it keeps the diff expressed against upstream, so it stays portable to
# JabRef/JabRef-Browser-Extension - or the branch below it in a stack. List a
# stack bottom-up; a later entry supersedes the earlier ones it builds on, so
# the earlier merges go no-op rather than replaying work.
#
# A conflict with main fails loudly - experimental is broken until someone
# merges origin/main into it by hand. The one exception is pnpm-lock.yaml,
# which is regenerated rather than merged. A conflicting or vanished PR is
# only a ::warning, so one stale entry never blocks the others. If a sync brings
# workflow-file changes, the push needs RELEASE_PR_TOKEN to carry the
# `workflow` scope.
name: Sync upstream

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - experimental
    paths:
      # Editing the PR list below re-merges right away instead of waiting for the nightly run.
      - .github/workflows/sync-upstream.yml

permissions:
  contents: write

env:
  # Merged into experimental on top of main, in order. Entries are PR URLs,
  # resolved to refs/pull/<number>/head; blank and #-comment lines are ignored.
  PRS: |
    # Add fulltext bridge for JabRef Browser-Extension Fulltext Protocol (was #81)
    https://github.com/JabRef/JabRef-Browser-Extension-experimental/pull/89
    # Extract shared native-messaging connection ownership - stacked on #89
    https://github.com/JabRef/JabRef-Browser-Extension-experimental/pull/82
    # Add MathSciNet tab open/focus command to the bridge - stacked on #82
    https://github.com/JabRef/JabRef-Browser-Extension-experimental/pull/83
    # Build and publish safari browser extension
    https://github.com/JabRef/JabRef-Browser-Extension/pull/681
    # Add diagnostics UI and popup logging for native messaging flow
    https://github.com/JabRef/JabRef-Browser-Extension/pull/699

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experimental
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: experimental
          fetch-depth: 0
          # PAT instead of github.token so the pushes trigger the test,
          # lint and release workflows on experimental.
          token: ${{ secrets.RELEASE_PR_TOKEN }}

      - name: Reset main to upstream
        run: |
          git fetch https://github.com/JabRef/JabRef-Browser-Extension.git main
          # Force, not fast-forward: main is a pure mirror of upstream, so
          # anything it is ahead by (a bot PR merged here by mistake, or an
          # upstream rewind) is discarded instead of blocking every later sync.
          # Nothing experimental needs is lost - experimental keeps its own
          # merges, and anything worth keeping belongs in the PRS list above.
          # Log what the reset drops, so a discarded commit is never silent.
          git log --oneline FETCH_HEAD..origin/main >> "$GITHUB_STEP_SUMMARY" || true
          git push --force origin FETCH_HEAD:refs/heads/main

      # Only to regenerate pnpm-lock.yaml on conflict, below.
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Merge main and PRs into experimental
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # pnpm-lock.yaml is generated from package.json, so a conflict in it
          # is not a real conflict - resolving it by hand is never right, and
          # the merged package.json already says what the tree should be. Any
          # other conflicted path still needs a human, hence the sole-file
          # check: without it this would commit a half-merged package.json.
          resolve_lockfile() {
            [ "$(git diff --name-only --diff-filter=U)" = pnpm-lock.yaml ] || return 1
            git checkout --theirs -- pnpm-lock.yaml &&
              pnpm install --lockfile-only --ignore-scripts &&
              git add pnpm-lock.yaml &&
              git commit --no-edit &&
              echo "::notice::pnpm-lock.yaml conflicted and was regenerated"
          }

          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "experimental already contains main"
          elif ! git merge --no-edit origin/main; then
            # Still loud when anything but the lockfile conflicts: experimental
            # is broken until someone merges origin/main into it by hand.
            resolve_lockfile || exit 1
          fi

          while read -r url; do
            case "$url" in '' | '#'*) continue ;; esac
            repo=${url#https://github.com/}
            number=${repo##*/}
            repo=${repo%%/pull/*}
            if ! git fetch --no-tags "https://github.com/$repo.git" "refs/pull/$number/head"; then
              echo "::warning::$url cannot be fetched (deleted?) - skipped"
              echo "- :warning: [$repo#$number]($url) - unreachable, skipped" >> "$GITHUB_STEP_SUMMARY"
            elif git merge --no-edit -m "Merge $repo#$number into experimental" FETCH_HEAD || resolve_lockfile; then
              echo "- :white_check_mark: [$repo#$number]($url)" >> "$GITHUB_STEP_SUMMARY"
            else
              git merge --abort
              echo "::warning::Merge conflict for $url - skipped"
              echo "- :x: [$repo#$number]($url) - merge conflict, skipped" >> "$GITHUB_STEP_SUMMARY"
            fi
          done <<< "$PRS"

          git push origin experimental
