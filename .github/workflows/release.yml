on:
  pull_request:
  push:
    branches:
      - experimental
name: release
permissions:
  id-token: write
  contents: write
  pull-requests: write
jobs:
  release-pr:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PR_TOKEN }}

      # Format changelog, workaround for https://github.com/google-github-actions/release-please-action/issues/542
      # Taken from https://github.com/remarkablemark/release-please-extra-files-demo/blob/master/.github/workflows/release-please.yml
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        if: ${{ steps.release.outputs.pr }}
        with:
          token: ${{ secrets.RELEASE_PR_TOKEN }}
          fetch-depth: 0
          ref: ${{ fromJson(steps.release.outputs.pr).headBranchName }}

      - name: Configure Git user
        if: ${{ steps.release.outputs.pr }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git --no-pager show --name-only

      - name: Format CHANGELOG.md
        if: ${{ steps.release.outputs.pr }}
        run: npx oxfmt CHANGELOG.md .release-please-manifest.json

      - name: Commit
        if: ${{ steps.release.outputs.pr }}
        run: |
          git add CHANGELOG.md .release-please-manifest.json
          git commit -m 'chore: Format CHANGELOG.md' --no-verify

      - name: Push changes
        if: ${{ steps.release.outputs.pr }}
        uses: ad-m/github-push-action@881a6320fdb16eb5318c5054f31c218aec2b324c # v1.3.0
        with:
          github_token: ${{ secrets.RELEASE_PR_TOKEN }}
          branch: ${{ fromJson(steps.release.outputs.pr).headBranchName }}

  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    needs: [release-pr]
    if: ${{ (github.event_name == 'pull_request' || needs.release-pr.outputs.release_created == 'true') && always() }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: true

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.16.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: |
          pnpm zip
          pnpm zip:firefox

      # Lets PR reviewers try the built extension without building from
      # source (download requires a GitHub login; anonymous downloads are
      # served by the experimental-latest prerelease below).
      - name: Upload extension zips as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: extension-zips
          path: .output/*.zip

      - name: Submit to stores
        run: |
          pnpm wxt submit \
            ${{ github.event_name == 'pull_request' && '--dry-run' || '' }} \
            --firefox-zip .output/*-firefox.zip --firefox-sources-zip .output/*-sources.zip

        #--chrome-zip .output/*-chrome.zip \
        #--edge-zip .output/{your-extension}-{version}-chrome.zip
        env:
          #CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          #CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          #CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          #CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          FIREFOX_EXTENSION_ID: "@jabfox"
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}

  # Rolling prerelease: every push to experimental refreshes the extension
  # zips on the experimental-latest prerelease, giving users a stable,
  # login-free download URL to try out unreleased builds.
  experimental-prerelease:
    name: Update experimental-latest prerelease
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: true

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.16.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: |
          pnpm zip
          pnpm zip:firefox

      - name: Upload to experimental-latest prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Version-independent names so the download URLs stay stable and
          # old-version assets do not pile up on the rolling release.
          cp .output/*-chrome.zip jabref-experimental-chrome.zip
          cp .output/*-firefox.zip jabref-experimental-firefox.zip
          gh release view experimental-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create experimental-latest --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Experimental build (rolling)" \
              --notes-file .github/experimental-release-notes.md
          gh release upload experimental-latest \
            jabref-experimental-chrome.zip \
            jabref-experimental-firefox.zip \
            --repo "$GITHUB_REPOSITORY" --clobber
